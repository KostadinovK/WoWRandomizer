name: CI

on:
  pull_request:
    branches: [master]

# A new push to the same pull request cancels the older in-progress run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore WoWRandomizer.slnx

      - name: Build
        run: dotnet build WoWRandomizer.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test WoWRandomizer.slnx --configuration Release --no-build --logger "console;verbosity=normal"
